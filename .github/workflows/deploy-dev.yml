name: Deploy Dev Editor

on:
  push:
    branches: [dev]
    paths: ['MapEditorPro.html', 'map-jobs.js', 'map-worker.js', 'hex-utils.js', 'gen-utils.js', 'zone-painter.js']

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Build dev HTML (inject <base href="../"> so relative paths resolve from repo root)
        run: |
          # Inject at start of <head> so it takes effect before any <script src> or <link> tags
          # GNU sed (ubuntu-latest) required — \n in replacement is literal on macOS sed
          sed 's|<head>|<head>\n<base href="../">|' MapEditorPro.html > /tmp/MapEditorPro_dev.html
          # map-jobs.js / map-worker.js are versioned with the HTML (job protocol), so dev must serve ITS OWN copies from
          # dev/ rather than whatever prod last published at the root: point the script tag and the Worker URL into dev/.
          # (importScripts inside the worker resolves relative to the worker URL, so it picks up dev/map-jobs.js.)
          sed -i 's|<script src="map-jobs.js|<script src="dev/map-jobs.js|; s|new Worker(.map-worker.js|new Worker('"'"'dev/map-worker.js|' /tmp/MapEditorPro_dev.html
          # hex-utils.js is new with the editing tools: dev serves its own copy too (prod has none at first deploy).
          sed -i 's|<script src="hex-utils.js|<script src="dev/hex-utils.js|' /tmp/MapEditorPro_dev.html
          grep -q 'src="dev/hex-utils.js?v=2"' /tmp/MapEditorPro_dev.html
          # gen-utils.js (heightmap import maths): published into dev/ too; its ?v= is bumped with every change to the file.
          sed -i 's|<script src="gen-utils.js|<script src="dev/gen-utils.js|' /tmp/MapEditorPro_dev.html
          grep -q 'src="dev/gen-utils.js?v=2"' /tmp/MapEditorPro_dev.html
          # zone-painter.js (Zone Painter + its layer-lock gates) is published into dev/ as well, so dev never runs the stale root copy.
          # Its ?v= is a plain cache-buster that is bumped with every change to the file: only require that the tag keeps one.
          sed -i 's|<script src="zone-painter.js|<script src="dev/zone-painter.js|' /tmp/MapEditorPro_dev.html
          grep -Eq 'src="dev/zone-painter.js\?v=[0-9]+"' /tmp/MapEditorPro_dev.html
          # The ?v= (cache-buster) must equal MAP_JOBS_VERSION / MapJobs.VERSION; bump all of them together.
          grep -q 'src="dev/map-jobs.js?v=5"' /tmp/MapEditorPro_dev.html
          grep -q "new Worker('dev/map-worker.js?v=5'" /tmp/MapEditorPro_dev.html
          cp map-jobs.js /tmp/map-jobs.js
          cp map-worker.js /tmp/map-worker.js
          cp hex-utils.js /tmp/hex-utils.js
          cp gen-utils.js /tmp/gen-utils.js
          cp zone-painter.js /tmp/zone-painter.js

      - name: Deploy to gh-pages dev/ folder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout gh-pages
          cp /tmp/MapEditorPro_dev.html dev/MapEditorPro.html
          cp /tmp/map-jobs.js dev/map-jobs.js
          cp /tmp/map-worker.js dev/map-worker.js
          cp /tmp/hex-utils.js dev/hex-utils.js
          cp /tmp/gen-utils.js dev/gen-utils.js
          cp /tmp/zone-painter.js dev/zone-painter.js
          git add dev/MapEditorPro.html dev/map-jobs.js dev/map-worker.js dev/hex-utils.js dev/gen-utils.js dev/zone-painter.js
          if git diff --cached --quiet; then
            echo "No changes to deploy"
          else
            git commit -m "deploy(dev): update from $(git rev-parse dev | head -c 7)"
            git push origin gh-pages
          fi
